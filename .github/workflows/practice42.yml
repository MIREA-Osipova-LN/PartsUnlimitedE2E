  deploy:
    name: Deploy to local IIS
    needs: build
    runs-on: [self-hosted, Windows]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/partsunlimited-deploy
      - name: Deploy to IIS folder and configure database
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'partsunlimited-deploy'
          $destination = 'C:\sites\PartsUnlimited'
          if (-not (Test-Path $destination)) { throw 'IIS site folder not found. Run setup-iis.ps1 as administrator first.' }
          if (-not (Test-Path (Join-Path $source 'Web.config'))) { throw 'Build artifact does not include Web.config.' }
          # Preserve web.config until after copying, then configure the local SQL Express connection.
          & robocopy $source $destination /E /R:2 /W:1 /XF 'Web.config'
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          Copy-Item (Join-Path $source 'Web.config') (Join-Path $destination 'Web.config') -Force
          $config = Join-Path $destination 'Web.config'
          [xml]$xml = Get-Content -LiteralPath $config -Raw
          $entry = $xml.configuration.connectionStrings.add | Where-Object { $_.name -eq 'DefaultConnectionString' }
          if (-not $entry) { throw 'DefaultConnectionString not found in Web.config' }
          $entry.connectionString = 'Server=.\SQLEXPRESS;Database=PartsUnlimitedWebsite;Integrated Security=True;TrustServerCertificate=True;'
          $xml.Save($config)
          Write-Host 'Files copied and local SQL Express connection configured.'
      - name: Check IIS website
        shell: powershell
        run: |
          $url = 'http://localhost:8080/'
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 40
          if ($response.StatusCode -ne 200) { throw "IIS returned HTTP $($response.StatusCode)" }
          Write-Host "Website responds with HTTP $($response.StatusCode) at $url"

