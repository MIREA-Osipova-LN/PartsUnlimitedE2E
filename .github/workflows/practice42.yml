name: Practice 4.2 - CI CD YAML

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  PROJECT_DIR: PartsUnlimited-aspnet45

jobs:
  build:
    name: Build and test
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore "$env:PROJECT_DIR/PartsUnlimited.sln" -NonInteractive
      - name: Build website and prepare deployment files
        shell: powershell
        run: |
          $project = "$env:PROJECT_DIR/src/PartsUnlimitedWebsite/PartsUnlimitedWebsite.csproj"
          & msbuild $project /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=AnyCPU /p:RestorePackages=false /p:DeployOnBuild=true /p:WebPublishMethod=Package /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # MSBuild prepares the full website in PackageTmp.
          $packageTmp = Join-Path $env:GITHUB_WORKSPACE "$env:PROJECT_DIR\src\PartsUnlimitedWebsite\obj\$env:BUILD_CONFIGURATION\Package\PackageTmp"
          if (-not (Test-Path (Join-Path $packageTmp 'Web.config'))) { throw "Web.config not found in $packageTmp" }
          if (-not (Test-Path (Join-Path $packageTmp 'bin\PartsUnlimited.dll'))) { throw "PartsUnlimited.dll not found in $packageTmp" }
          $publish = Join-Path $env:RUNNER_TEMP 'partsunlimited-publish'
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }
          New-Item -ItemType Directory -Path $publish -Force | Out-Null
          Copy-Item -Path (Join-Path $packageTmp '*') -Destination $publish -Recurse -Force
          Write-Host "Website files prepared in $publish"
      - name: Build unit tests
        shell: powershell
        run: msbuild "$env:PROJECT_DIR/test/PartsUnlimited.UnitTests/PartsUnlimited.UnitTests.csproj" /p:Configuration=$env:BUILD_CONFIGURATION /p:Platform=AnyCPU /p:RestorePackages=false /m
      - name: Run unit tests
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          # Choose an installation containing MSBuild, not SQL Server Management Studio.
          $installations = @(& $vswhere -products * -requires Microsoft.Component.MSBuild -property installationPath)
          $vstest = $null
          foreach ($vs in $installations) {
            $candidate = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'
            if (Test-Path $candidate) { $vstest = $candidate; break }
          }
          if (-not $vstest) { throw 'vstest.console.exe not found in Visual Studio Build Tools. Open Visual Studio Installer and install the Test tools core features component.' }
          Write-Host "Using VSTest: $vstest"
          $dll = Join-Path $env:GITHUB_WORKSPACE "$env:PROJECT_DIR\test\PartsUnlimited.UnitTests\bin\$env:BUILD_CONFIGURATION\PartsUnlimited.UnitTests.dll"
          & $vstest $dll '/Logger:trx;LogFileName=unit-tests.trx' "/ResultsDirectory:$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish deployment artifact (drop)
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/partsunlimited-publish/
          if-no-files-found: error
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/*.trx
          if-no-files-found: warn

  deploy:
    name: Deploy to local IIS
    needs: build
    runs-on: [self-hosted, Windows]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/partsunlimited-deploy
      - name: Deploy to IIS folder and configure database
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'partsunlimited-deploy'
          $destination = 'C:\sites\PartsUnlimited'
          if (-not (Test-Path $destination)) { throw 'IIS site folder not found. Run setup-iis.ps1 as administrator first.' }
          if (-not (Test-Path (Join-Path $source 'Web.config'))) { throw 'Build artifact does not include Web.config.' }
          # Preserve web.config until after copying, then configure the local SQL Express connection.
          & robocopy $source $destination /E /R:2 /W:1 /XF 'Web.config'
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          Copy-Item (Join-Path $source 'Web.config') (Join-Path $destination 'Web.config') -Force
          $config = Join-Path $destination 'Web.config'
          [xml]$xml = Get-Content -LiteralPath $config -Raw
          $entry = $xml.configuration.connectionStrings.add | Where-Object { $_.name -eq 'DefaultConnectionString' }
          if (-not $entry) { throw 'DefaultConnectionString not found in Web.config' }
          $entry.connectionString = 'Server=.\SQLEXPRESS;Database=PartsUnlimitedWebsite;Integrated Security=True;TrustServerCertificate=True;'
          $xml.Save($config)
          Write-Host 'Files copied and local SQL Express connection configured.'
      - name: Check IIS website
        shell: powershell
        run: |
          $url = 'http://localhost:8080/'
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 40
          if ($response.StatusCode -ne 200) { throw "IIS returned HTTP $($response.StatusCode)" }
          Write-Host "Website responds with HTTP $($response.StatusCode) at $url"
